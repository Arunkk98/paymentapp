---
- name: PART 0 - AUTOMATED CLEANUP & HOSTNAME ENFORCEMENT
  hosts: all
  become: yes
  tasks:
    - name: Reset any existing kubeadm setup
      command: kubeadm reset -f
      ignore_errors: yes

    - name: Clean up CNI configs and iptables
      shell: |
        rm -rf /etc/cni/net.d /etc/kubernetes/admin.conf $HOME/.kube/config
        iptables -F && iptables -t nat -F && iptables -t mangle -F && iptables -X
      ignore_errors: yes

    - name: Set system hostname from inventory
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Ensure inventory hostname is in /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "127.0.1.1 {{ inventory_hostname }}"
        regexp: '^127\.0\.1\.1'
        state: present

- name: PART 1 - SYSTEM PREPARATION (swap, modules, sysctl)
  hosts: all
  become: yes
  tasks:
    - name: Disable swap immediately
      command: swapoff -a
      ignore_errors: yes

    - name: Remove swap from fstab permanently
      replace:
        path: /etc/fstab
        regexp: '^.*swap.*$'
        replace: ''

    - name: Create k8s modules config
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Load kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Create sysctl config for k8s
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: Apply sysctl params
      command: sysctl --system

- name: PART 2 - INSTALL CONTAINER RUNTIME (containerd)
  hosts: all
  become: yes
  tasks:
    - name: Download containerd
      get_url:
        url: https://github.com/containerd/containerd/releases/download/v1.7.14/containerd-1.7.14-linux-amd64.tar.gz
        dest: /tmp/containerd-1.7.14-linux-amd64.tar.gz

    - name: Extract containerd to /usr/local
      unarchive:
        src: /tmp/containerd-1.7.14-linux-amd64.tar.gz
        dest: /usr/local
        remote_src: yes

    - name: Download containerd service
      get_url:
        url: https://raw.githubusercontent.com/containerd/containerd/main/containerd.service
        dest: /etc/systemd/system/containerd.service

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory

    - name: Generate containerd default config
      shell: /usr/local/bin/containerd config default | tee /etc/containerd/config.toml

    - name: Enable systemd cgroup
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Reload systemd and start containerd
      systemd:
        daemon_reload: yes
        name: containerd
        state: started
        enabled: yes

- name: PART 3 - INSTALL runc
  hosts: all
  become: yes
  tasks:
    - name: Download runc
      get_url:
        url: https://github.com/opencontainers/runc/releases/download/v1.1.12/runc.amd64
        dest: /tmp/runc.amd64
        mode: '0755'

    - name: Install runc
      copy:
        src: /tmp/runc.amd64
        dest: /usr/local/sbin/runc
        mode: '0755'
        remote_src: yes

- name: PART 4 - INSTALL CNI PLUGINS
  hosts: all
  become: yes
  tasks:
    - name: Download CNI plugins
      get_url:
        url: https://github.com/containernetworking/plugins/releases/download/v1.5.0/cni-plugins-linux-amd64-v1.5.0.tgz
        dest: /tmp/cni-plugins-linux-amd64-v1.5.0.tgz

    - name: Create CNI bin directory
      file:
        path: /opt/cni/bin
        state: directory

    - name: Extract CNI plugins
      unarchive:
        src: /tmp/cni-plugins-linux-amd64-v1.5.0.tgz
        dest: /opt/cni/bin
        remote_src: yes

- name: PART 5 - INSTALL KUBERNETES (kubeadm, kubelet, kubectl)
  hosts: all
  become: yes
  tasks:
    - name: Create apt keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes GPG key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key
        dest: /tmp/kubernetes-release.key

    - name: Install Kubernetes key
      shell: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /"
        state: present
        filename: kubernetes

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Kubernetes packages
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Hold Kubernetes packages
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet
      systemd:
        name: kubelet
        enabled: yes

- name: PART 6 - CONFIGURE CRICTL
  hosts: all
  become: yes
  tasks:
    - name: Configure crictl runtime endpoint
      command: crictl config runtime-endpoint unix:///var/run/containerd/containerd.sock
      ignore_errors: yes

- name: PART 7 - INITIALIZE CONTROL PLANE (MASTER)
  hosts: master
  become: yes
  tasks:
    - name: Check if cluster already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: cluster_exists

    - name: Initialize Kubernetes cluster
      command: >
        kubeadm init
        --pod-network-cidr=192.168.0.0/16
        --apiserver-advertise-address={{ hostvars[inventory_hostname]['ansible_host'] }}
        --node-name={{ inventory_hostname }}
      when: not cluster_exists.stat.exists

    - name: Prepare kubeconfig directory
      file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        mode: '0755'

    - name: Copy admin.conf to kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ ansible_env.HOME }}/.kube/config"
        remote_src: yes

- name: PART 8 - INSTALL CALICO CNI
  hosts: master
  become: yes
  tasks:
    - name: Install Calico operator
      command: kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/tigera-operator.yaml
      ignore_errors: yes

    - name: Download Calico custom resources
      get_url:
        url: https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/custom-resources.yaml
        dest: /tmp/custom-resources.yaml

    - name: Install Calico custom resources
      command: kubectl apply -f /tmp/custom-resources.yaml
      ignore_errors: yes

- name: PART 9 - GET JOIN COMMAND
  hosts: master
  become: yes
  tasks:
    - name: Generate join command
      command: kubeadm token create --print-join-command
      register: join_command

    - name: Save join command for workers
      copy:
        content: "{{ join_command.stdout }}"
        dest: /tmp/join-command.txt
      delegate_to: localhost

- name: PART 10 - JOIN WORKER NODES
  hosts: workers
  become: yes
  tasks:
    - name: Read join command
      slurp:
        src: /tmp/join-command.txt
      register: join_cmd
      delegate_to: localhost

    - name: Join worker node
      command: "{{ (join_cmd.content | b64decode).strip() }} --node-name={{ inventory_hostname }}"

- name: PART 11 - FINAL VERIFICATION
  hosts: master
  become: yes
  tasks:
    - name: Get node status
      command: kubectl get nodes -o wide
      register: nodes

    - name: Get all pods
      command: kubectl get pods --all-namespaces
      register: pods

    - name: Final success message
      debug:
        msg:
          - ""
          - "╔══════════════════════════════════════════════════════════════════════╗"
          - "║      ✅ KUBERNETES CLUSTER FULLY DEPLOYED & AUTOMATED! ✅            ║"
          - "╚══════════════════════════════════════════════════════════════════════╝"
          - ""
          - "📊 NODE STATUS:"
          - "{{ nodes.stdout_lines }}"
          - ""
          - "📦 PODS STATUS:"
          - "{{ pods.stdout_lines }}"
