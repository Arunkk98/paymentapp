apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payment-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      # --- SENIOR PATTERN: AUTOMATED DB MIGRATION INITCONTAINER ---
      initContainers:
        - name: db-migration
          image: ghcr.io/arunkk98/payment-api:62eff90
          command:
            - sh
            - -c
            - |
              until psql "postgresql://payuser:PaySecurePassword123!@postgres:5432/paymentdb" -c '\q'; do
                echo "Waiting for PostgreSQL database to be ready..."
                sleep 2
              done
              echo "Creating transactions table..."
              psql "postgresql://payuser:PaySecurePassword123!@postgres:5432/paymentdb" -c "
                CREATE TABLE IF NOT EXISTS transactions (
                  id SERIAL PRIMARY KEY,
                  account_id VARCHAR(50),
                  amount DECIMAL(10,2),
                  status VARCHAR(20),
                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                );"
      # --- MAIN APPLICATION CONTAINER ---
      containers:
        - name: payment-api
          image: ghcr.io/arunkk98/payment-api:62eff90
          args:
            - "-text=Payment API v1.0.0 Online"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api-service
  namespace: payment-system
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5678
  selector:
    app: payment-api
