apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/arunkk98/paymentapp.git'
    targetRevision: HEAD
    path: paymentapp-gitops/apps
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: payment-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
