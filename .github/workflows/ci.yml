name: Payment API CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'src/payment-api/**'  # Only trigger when application code changes

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag (Git Commit SHA)
        id: vars
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/payment-api:${{ steps.vars.outputs.SHA }} src/payment-api/
          docker tag ghcr.io/${{ github.repository_owner }}/payment-api:${{ steps.vars.outputs.SHA }} ghcr.io/${{ github.repository_owner }}/payment-api:latest

      - name: Push Docker Image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/payment-api:${{ steps.vars.outputs.SHA }}
          docker push ghcr.io/${{ github.repository_owner }}/payment-api:latest

      - name: Update Deployment Manifest with New Image Tag
        run: |
          sed -i 's|image: .*|image: ghcr.io/${{ github.repository_owner }}/payment-api:${{ steps.vars.outputs.SHA }}|g' paymentapp-gitops/apps/payment-api/deployment.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add paymentapp-gitops/apps/payment-api/deployment.yaml
          git commit -m "ci: update payment-api image tag to ${{ steps.vars.outputs.SHA }} [skip ci]"
          git push
