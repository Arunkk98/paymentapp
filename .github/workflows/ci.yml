name: Payment API CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'src/payment-api/**'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Set up Docker Buildx (BuildKit Engine)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Authenticate to GHCR
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Extract Metadata & Sanitize Tags (Handles lowercasing automatically!)
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/payment-api
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      # 4. Build and Push with Caching & BuildKit
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: src/payment-api
          file: src/payment-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. GitOps Image Tag Update
      - name: Update Deployment Manifest with New Image Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main --rebase
          
          REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(git rev-parse --short HEAD)
          
          sed -i "s|image: .*|image: ghcr.io/${REPO_LOWER}/payment-api:${SHA}|g" paymentapp-gitops/apps/payment-api/deployment.yaml
          
          git add paymentapp-gitops/apps/payment-api/deployment.yaml
          git commit -m "ci: update payment-api image tag to ${SHA} [skip ci]" || echo "No changes to commit"
          git push origin main
